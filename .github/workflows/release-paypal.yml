name: Release @neighborline/paypal

# Manual only. Publishes packages/paypal to npm with a provenance attestation (SLSA, signed via GitHub OIDC).
# Needs the NPM_TOKEN repository secret (an npm *automation* or granular token with publish rights to the
# @neighborline scope) and a public repository (npm only attests provenance for public source).
# Full checklist: docs/RELEASING.md.

on:
  workflow_dispatch:
    inputs:
      dist_tag:
        description: 'npm dist-tag (latest, next, beta)'
        required: true
        default: latest
        type: choice
        options: [latest, next, beta]
      dry_run:
        description: 'Dry run: build, test, pack and run `npm publish --dry-run` only'
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-paypal
  cancel-in-progress: false

env:
  PAYPAL_MODE: fake
  AI_MODE: fixture

jobs:
  release:
    name: Test, pack and publish
    # ubuntu-latest moved to Ubuntu 26 (2026-10-19); playwright install --with-deps does not support it yet.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: npm
    permissions:
      contents: read
      id-token: write # npm provenance: lets npm request a GitHub OIDC token to sign the attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # The gate: nothing is published unless the package and its two in-repo consumers are green.
      - name: Typecheck
        run: pnpm --filter @neighborline/paypal --filter @neighborline/approver --filter @neighborline/web typecheck

      - name: Unit tests (paypal, approver, web, MCP demo)
        run: pnpm --filter @neighborline/paypal --filter @neighborline/approver --filter @neighborline/web --filter @neighborline/example-mcp-agent-demo test

      - name: Refuse a version that is already on npm
        working-directory: packages/paypal
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "::error::$NAME@$VERSION is already published. Bump the version and add a CHANGELOG entry."
            exit 1
          fi
          grep -q "^## $VERSION" CHANGELOG.md || { echo "::error::CHANGELOG.md has no '## $VERSION' heading"; exit 1; }
          echo "Releasing $NAME@$VERSION"

      # Builds with tsup, packs with pnpm (which applies publishConfig: dist exports, bin, no workspace: ranges),
      # then fails on stray files, broken export targets or anything that looks like a credential.
      - name: Build, pack and check the tarball
        run: pnpm --filter @neighborline/paypal pack:check --keep "$RUNNER_TEMP/pkg"

      # The tarball checked above is exactly what gets published (npm would ignore publishConfig if run in the folder).
      - name: Publish (dry run)
        if: ${{ inputs.dry_run }}
        run: npm publish "$RUNNER_TEMP"/pkg/*.tgz --dry-run --access public --tag "${{ inputs.dist_tag }}"

      - name: Publish with provenance
        if: ${{ !inputs.dry_run }}
        run: npm publish "$RUNNER_TEMP"/pkg/*.tgz --provenance --access public --tag "${{ inputs.dist_tag }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

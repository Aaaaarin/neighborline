# Renders the demo video's voiceover lines with OpenAI TTS and uploads them as an artifact.
# Why here: the machine that builds the video cannot reach api.openai.com. The lines (text, voice, instructions)
# are in docs/submission/video/vo-jobs.json, written by `node docs/submission/video/build.mjs --vo-jobs …`.
# Needs the repository secret OPENAI_API_KEY (a project key with a spend limit). Manual runs only.
name: Voiceover
on:
  workflow_dispatch:
permissions:
  contents: write # pushes the WAVs to the vo-lines branch (artifact downloads are blocked on the build machine)
jobs:
  tts:
    # ubuntu-latest moved to Ubuntu 26 on 2026-10-19; pinned like ci.yml.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Render the voiceover lines
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node docs/submission/video/tts-jobs.mjs docs/submission/video/vo-jobs.json vo
      - name: Push the lines to the vo-lines branch
        run: |
          cd vo
          git init -q -b vo-lines
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add *.wav
          git commit -q -m "voiceover lines from ${GITHUB_SHA::7} (docs/submission/video/vo-jobs.json)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" vo-lines

name: Add or improve a language
description: Vetted messages for neighbors in a new language, or better wording in an existing one.
labels: [i18n, good first issue]
body:
  - type: markdown
    attributes:
      value: |
        Neighbors receive status messages from a vetted catalog, not from free model output. CONTRIBUTING.md
        ("Adding a language to the message catalog") lists the files and tests.
  - type: input
    id: lang
    attributes:
      label: Language and BCP-47 code
      placeholder: Tagalog (tl)
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: What kind of change
      options:
        - New catalog language
        - Wording fix in an existing language
    validations:
      required: true
  - type: textarea
    id: review
    attributes:
      label: Who will review the wording?
      description: A native speaker, ideally someone who has worked with mutual aid or community services. Which register (formal or informal)?
  - type: textarea
    id: notes
    attributes:
      label: Notes
